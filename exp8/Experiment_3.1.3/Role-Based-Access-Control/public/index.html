<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBAC System — Experiment 3.1.3</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --admin: #f59e0b;
      --manager: #7c3aed;
      --editor: #06b6d4;
      --viewer: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }
    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    /* Layout */
    .app-shell { display: flex; min-height: 100vh; position: relative; z-index: 1; }
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo-title {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
    }
    .sidebar-user {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-role {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }
    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-section-label {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 12px 24px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s;
      border-left: 3px solid transparent;
      position: relative;
    }
    .nav-item:hover { background: rgba(124,58,237,0.08); color: var(--text); }
    .nav-item.active {
      background: rgba(124,58,237,0.12);
      color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item .icon { font-size: 15px; width: 20px; text-align: center; }
    .nav-badge {
      margin-left: auto;
      font-size: 9px;
      background: var(--accent);
      color: white;
      padding: 2px 6px;
      border-radius: 100px;
      font-family: 'Space Mono', monospace;
    }
    .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--border); }
    .logout-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Syne', sans-serif;
      transition: all 0.15s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.08); }
    /* Main content */
    .main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 50;
      gap: 16px;
    }
    .topbar-title { font-size: 16px; font-weight: 700; flex: 1; }
    .topbar-badge {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid currentColor;
    }
    .page-content { padding: 32px; flex: 1; }
    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; }
    .card-body { padding: 24px; }
    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .stat-card.admin-card::before { background: var(--admin); }
    .stat-card.manager-card::before { background: var(--manager); }
    .stat-card.editor-card::before { background: var(--editor); }
    .stat-card.viewer-card::before { background: var(--viewer); }
    .stat-card.total-card::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .stat-number { font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'Space Mono', monospace; }
    /* Role badges */
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .role-admin { background: rgba(245,158,11,0.15); color: var(--admin); border: 1px solid rgba(245,158,11,0.3); }
    .role-manager { background: rgba(124,58,237,0.15); color: var(--manager); border: 1px solid rgba(124,58,237,0.3); }
    .role-editor { background: rgba(6,182,212,0.15); color: var(--editor); border: 1px solid rgba(6,182,212,0.3); }
    .role-viewer { background: rgba(16,185,129,0.15); color: var(--viewer); border: 1px solid rgba(16,185,129,0.3); }
    /* Table */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      padding: 12px 16px;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(42,42,58,0.5);
    }
    .data-table tr:hover td { background: rgba(124,58,237,0.04); }
    .data-table tr:last-child td { border-bottom: none; }
    /* Forms */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 11px; font-family: 'Space Mono', monospace; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Syne', sans-serif;
      transition: border-color 0.15s;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    .form-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Syne', sans-serif;
      transition: border-color 0.15s;
      outline: none;
      cursor: pointer;
    }
    .form-select:focus { border-color: var(--accent); }
    /* Buttons */
    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: 'Syne', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #6d28d9; transform: translateY(-1px); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-success { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .btn-sm { padding: 5px 12px; font-size: 11px; }
    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .alert-warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
    .alert-info { background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3); color: #67e8f9; }
    /* Login page */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
    }
    .login-header { margin-bottom: 32px; }
    .login-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 6px; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    .demo-accounts {
      margin-top: 20px;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .demo-title { font-size: 10px; font-family: 'Space Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .demo-item {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 12px;
    }
    .demo-item:hover { border-color: var(--accent); }
    .demo-item-role { font-size: 10px; font-family: 'Space Mono', monospace; margin-bottom: 2px; }
    .demo-item-creds { font-size: 10px; color: var(--text-muted); }
    /* Permission tags */
    .perm-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .perm-tag {
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .perm-tag.read { border-color: rgba(6,182,212,0.3); color: var(--editor); background: rgba(6,182,212,0.08); }
    .perm-tag.write { border-color: rgba(124,58,237,0.3); color: #a78bfa; background: rgba(124,58,237,0.08); }
    .perm-tag.delete { border-color: rgba(239,68,68,0.3); color: #fca5a5; background: rgba(239,68,68,0.08); }
    /* Access denied */
    .access-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }
    .access-denied-icon { font-size: 56px; margin-bottom: 20px; opacity: 0.5; }
    .access-denied h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--danger); }
    .access-denied p { color: var(--text-muted); font-size: 14px; }
    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
    .tab {
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-muted);
      border: none;
      background: transparent;
      font-family: 'Syne', sans-serif;
    }
    .tab.active { background: var(--accent); color: white; }
    .tab:hover:not(.active) { color: var(--text); background: var(--surface2); }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; line-height: 1; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
    /* Status dot */
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
    .status-dot.inactive { background: var(--text-muted); }
    /* Hierarchy viz */
    .hierarchy { display: flex; flex-direction: column; gap: 12px; }
    .hierarchy-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
    }
    .hierarchy-level {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      flex-shrink: 0;
    }
    .hierarchy-bar {
      height: 4px;
      border-radius: 2px;
      flex: 1;
      max-width: 300px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }
    .spin {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useContext, createContext, useCallback } = React;

// ─── Constants ───────────────────────────────────────────────────────────────
const API_BASE = '/api';

const ROLE_COLORS = { admin: '#f59e0b', manager: '#7c3aed', editor: '#06b6d4', viewer: '#10b981' };
const ROLE_LEVELS = { admin: 4, manager: 3, editor: 2, viewer: 1 };
const ROLE_HIERARCHY = [
  { role: 'admin',   level: 4, width: '100%', desc: 'Full system access — user management, settings, audit logs' },
  { role: 'manager', level: 3, width: '75%',  desc: 'Team management, reports, content control' },
  { role: 'editor',  level: 2, width: '50%',  desc: 'Create and edit content, view reports' },
  { role: 'viewer',  level: 1, width: '25%',  desc: 'Read-only access to published content' }
];

// ─── Auth Context ─────────────────────────────────────────────────────────────
const AuthContext = createContext(null);

const useAuth = () => useContext(AuthContext);

const AuthProvider = ({ children }) => {
  const [user, setUser] = useState(null);
  const [token, setToken] = useState(() => localStorage.getItem('rbac_token'));
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (token) fetchMe();
    else setLoading(false);
  }, []);

  const fetchMe = async () => {
    try {
      const res = await apiFetch('/auth/me', { token });
      if (res.success) setUser(res.user);
      else logout();
    } catch { logout(); }
    finally { setLoading(false); }
  };

  const login = async (email, password) => {
    const res = await apiFetch('/auth/login', { method: 'POST', body: { email, password } });
    if (res.success) {
      setToken(res.token);
      setUser(res.user);
      localStorage.setItem('rbac_token', res.token);
    }
    return res;
  };

  const register = async (data) => {
    const res = await apiFetch('/auth/register', { method: 'POST', body: data });
    if (res.success) {
      setToken(res.token);
      setUser(res.user);
      localStorage.setItem('rbac_token', res.token);
    }
    return res;
  };

  const logout = () => {
    setUser(null);
    setToken(null);
    localStorage.removeItem('rbac_token');
  };

  const hasPermission = (perm) => user?.permissions?.includes(perm) || false;
  const hasRole = (...roles) => roles.includes(user?.role);
  const hasMinRole = (minRole) => (ROLE_LEVELS[user?.role] || 0) >= (ROLE_LEVELS[minRole] || 0);

  return (
    <AuthContext.Provider value={{ user, token, loading, login, logout, register, hasPermission, hasRole, hasMinRole }}>
      {children}
    </AuthContext.Provider>
  );
};

// ─── API Helper ───────────────────────────────────────────────────────────────
const apiFetch = async (path, options = {}) => {
  const { method = 'GET', body, token } = options;
  const tok = token || localStorage.getItem('rbac_token');
  const headers = { 'Content-Type': 'application/json' };
  if (tok) headers['Authorization'] = `Bearer ${tok}`;

  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
};

// ─── Helper Components ────────────────────────────────────────────────────────
const RoleBadge = ({ role }) => (
  <span className={`role-badge role-${role}`}>
    {role === 'admin' && '👑 '}{role === 'manager' && '🛡 '}{role === 'editor' && '✏️ '}{role === 'viewer' && '👁 '}
    {role}
  </span>
);

const PermTag = ({ perm }) => {
  const type = perm.split(':')[1];
  return <span className={`perm-tag ${type}`}>{perm}</span>;
};

const Alert = ({ type = 'error', children }) => (
  <div className={`alert alert-${type}`}>
    {type === 'error' && '⚠ '}{type === 'success' && '✓ '}{type === 'info' && 'ℹ '}{type === 'warning' && '⚡ '}
    {children}
  </div>
);

const AccessDenied = ({ required }) => (
  <div className="access-denied">
    <div className="access-denied-icon">🔒</div>
    <h2>Access Denied</h2>
    <p>You need {required ? `"${required}" role or higher` : 'higher privileges'} to view this page.</p>
  </div>
);

const Loading = () => (

// ─── Login Page ────────────────────────────────────────────────────────────────
const LoginPage = () => {
  const { login, register } = useAuth();
  const [mode, setMode] = useState('login');
  const [form, setForm] = useState({ username: '', email: '', password: '', role: 'viewer' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const DEMO = [
    { role: 'admin', email: 'admin@rbac.com', password: 'admin123' },
    { role: 'manager', email: 'manager@rbac.com', password: 'manager123' },
    { role: 'editor', email: 'editor@rbac.com', password: 'editor123' },
    { role: 'viewer', email: 'viewer@rbac.com', password: 'viewer123' }
  ];

  const seed = async () => {
    setLoading(true);
    await apiFetch('/auth/seed', { method: 'POST' });
    setLoading(false);
    setError('');
    alert('Demo accounts created! Use them below.');
  };

  const handleSubmit = async () => {
    setError(''); setLoading(true);
    try {
      const res = mode === 'login'
        ? await login(form.email, form.password)
        : await register(form);
      if (!res.success) setError(res.error || 'Something went wrong');
    } catch { setError('Network error. Is the backend running?'); }
    setLoading(false);
  };

  const fillDemo = (d) => setForm(f => ({ ...f, email: d.email, password: d.password }));

  return (
    <div className="login-page">
      <div className="login-box">
        <div className="login-header">
          <div className="login-title">RBAC System</div>
          <div style={{ fontSize: 11, fontFamily: 'Space Mono', color: 'var(--text-muted)', marginTop: 4 }}>
            EXPERIMENT 3.1.3 — ROLE-BASED ACCESS CONTROL
          </div>
          <div className="login-subtitle">Authenticate to explore role-based features</div>
        </div>

        <div className="login-card">
          <div className="tabs" style={{ marginBottom: 24 }}>
            <button className={`tab ${mode === 'login' ? 'active' : ''}`} onClick={() => setMode('login')}>Sign In</button>
            <button className={`tab ${mode === 'register' ? 'active' : ''}`} onClick={() => setMode('register')}>Register</button>
          </div>

          {error && <Alert type="error">{error}</Alert>}

          {mode === 'register' && (
            <div className="form-group">
              <label className="form-label">Username</label>
              <input className="form-input" placeholder="your_username"
                value={form.username} onChange={e => setForm(f => ({ ...f, username: e.target.value }))} />
            </div>
          )}

          <div className="form-group">
            <label className="form-label">Email</label>
            <input className="form-input" type="email" placeholder="user@example.com"
              value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} />
          </div>

          <div className="form-group">
            <label className="form-label">Password</label>
            <input className="form-input" type="password" placeholder="••••••••"
              value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))} />
          </div>

          {mode === 'register' && (
            <div className="form-group">
              <label className="form-label">Role</label>
              <select className="form-select" value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}>
                <option value="viewer">Viewer (read-only)</option>
                <option value="editor">Editor (read + write)</option>
              </select>
              <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 6, fontFamily: 'Space Mono' }}>
                Admin/Manager roles are assigned by administrators only
              </div>
            </div>
          )}

          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}
            onClick={handleSubmit} disabled={loading}>
            {loading ? '⏳ Please wait...' : mode === 'login' ? '→ Sign In' : '→ Create Account'}
          </button>
        </div>

        <div className="demo-accounts">
          <div className="demo-title">🎭 Demo Accounts — click to autofill</div>
          <div className="demo-grid">
            {DEMO.map(d => (
              <div className="demo-item" key={d.role} onClick={() => fillDemo(d)}>
                <div className="demo-item-role"><RoleBadge role={d.role} /></div>
                <div className="demo-item-creds">{d.email}</div>
              </div>
            ))}
          </div>
          <button className="btn btn-secondary" style={{ width: '100%', justifyContent: 'center', marginTop: 12, fontSize: 11 }}
            onClick={seed} disabled={loading}>
            ⚡ Initialize Demo Accounts in DB
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── User Management (Admin) ──────────────────────────────────────────────────
const UsersPage = () => {
  const { hasPermission } = useAuth();
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // 'create' | 'edit'
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({ username: '', email: '', password: '', role: 'viewer' });
  const [msg, setMsg] = useState(null);
  const [search, setSearch] = useState('');

  if (!hasPermission('user:read')) return <AccessDenied required="manager" />;

  const load = async () => {
    setLoading(true);
    const res = await apiFetch('/admin/users');
    if (res.success) setUsers(res.data);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const createUser = async () => {
    const res = await apiFetch('/admin/users', { method: 'POST', body: form });
    if (res.success) { setMsg({ type: 'success', text: res.message }); setModal(null); load(); setForm({ username: '', email: '', password: '', role: 'viewer' }); }
    else setMsg({ type: 'error', text: res.error });
  };

  const updateUser = async () => {
    const res = await apiFetch(`/admin/users/${selected._id}`, { method: 'PUT', body: { role: form.role, isActive: form.isActive } });
    if (res.success) { setMsg({ type: 'success', text: 'User updated' }); setModal(null); load(); }
    else setMsg({ type: 'error', text: res.error });
  };

  const deleteUser = async (id, name) => {
    if (!confirm(`Delete user "${name}"?`)) return;
    const res = await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
    setMsg(res.success ? { type: 'success', text: res.message } : { type: 'error', text: res.error });
    if (res.success) load();
  };

  const toggleActive = async (u) => {
    const res = await apiFetch(`/admin/users/${u._id}`, { method: 'PUT', body: { isActive: !u.isActive } });
    if (res.success) load();
  };

  const filtered = users.filter(u =>
    u.username.toLowerCase().includes(search.toLowerCase()) ||
    u.email.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div className="section-header">
        <div className="section-title">User Management</div>
        {hasPermission('user:write') && (
          <button className="btn btn-primary" onClick={() => { setForm({ username: '', email: '', password: '', role: 'viewer' }); setModal('create'); }}>
            + New User
          </button>
        )}
      </div>

      {msg && <Alert type={msg.type}>{msg.text}</Alert>}

      <div className="card">
        <div className="card-header">
          <input className="form-input" style={{ maxWidth: 260 }} placeholder="🔍 Search users..."
            value={search} onChange={e => setSearch(e.target.value)} />
          <div style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--text-muted)' }}>{filtered.length} users</div>
        </div>
        {loading ? <Loading /> : (
          <table className="data-table">
            <thead><tr>
              <th>User</th><th>Role</th><th>Status</th><th>Last Login</th><th>Joined</th>
              {hasPermission('user:write') && <th>Actions</th>}
            </tr></thead>
            <tbody>
              {filtered.map(u => (
                <tr key={u._id}>
                  <td>
                    <div style={{ fontWeight: 600 }}>{u.username}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{u.email}</div>
                  </td>
                  <td><RoleBadge role={u.role} /></td>
                  <td>
                    <span className={`status-dot ${u.isActive ? 'active' : 'inactive'}`} style={{ marginRight: 6 }}></span>
                    {u.isActive ? 'Active' : 'Inactive'}
                  </td>
                  <td style={{ fontSize: 12, color: 'var(--text-muted)' }}>{u.lastLogin ? new Date(u.lastLogin).toLocaleDateString() : 'Never'}</td>
                  <td style={{ fontSize: 12, color: 'var(--text-muted)' }}>{new Date(u.createdAt).toLocaleDateString()}</td>
                  {hasPermission('user:write') && (
                    <td>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => { setSelected(u); setForm({ role: u.role, isActive: u.isActive }); setModal('edit'); }}>Edit</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => toggleActive(u)}>{u.isActive ? 'Disable' : 'Enable'}</button>
                        {hasPermission('user:delete') && (
                          <button className="btn btn-danger btn-sm" onClick={() => deleteUser(u._id, u.username)}>Delete</button>
                        )}
                      </div>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* Create Modal */}
      {modal === 'create' && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">Create New User</div>
              <button className="modal-close" onClick={() => setModal(null)}>×</button>
            </div>
            <div className="modal-body">
              {['username', 'email', 'password'].map(f => (
                <div className="form-group" key={f}>
                  <label className="form-label">{f}</label>
                  <input className="form-input" type={f === 'password' ? 'password' : 'text'}
                    value={form[f] || ''} onChange={e => setForm(p => ({ ...p, [f]: e.target.value }))} />
                </div>
              ))}
              <div className="form-group">
                <label className="form-label">Role</label>
                <select className="form-select" value={form.role} onChange={e => setForm(p => ({ ...p, role: e.target.value }))}>
                  {['admin', 'manager', 'editor', 'viewer'].map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={createUser}>Create User</button>
            </div>
          </div>
        </div>
      )}

      {/* Edit Modal */}
      {modal === 'edit' && selected && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">Edit: {selected.username}</div>
              <button className="modal-close" onClick={() => setModal(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Role</label>
                <select className="form-select" value={form.role} onChange={e => setForm(p => ({ ...p, role: e.target.value }))}>
                  {['admin', 'manager', 'editor', 'viewer'].map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Status</label>
                <select className="form-select" value={form.isActive} onChange={e => setForm(p => ({ ...p, isActive: e.target.value === 'true' }))}>
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={updateUser}>Save Changes</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Content Page ─────────────────────────────────────────────────────────────
const ContentPage = () => {
  const { hasPermission } = useAuth();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ title: '', body: '', category: 'Security' });
  const [msg, setMsg] = useState(null);

  if (!hasPermission('content:read')) return <AccessDenied required="editor" />;

  useEffect(() => {
    apiFetch('/users/content').then(r => {
      if (r.success) setItems(r.data);
      setLoading(false);
    });
  }, []);

  const create = async () => {
    const res = await apiFetch('/users/content', { method: 'POST', body: form });
    if (res.success) {
      setItems(p => [res.data, ...p]);
      setMsg({ type: 'success', text: 'Content created!' });
      setModal(false);
    } else setMsg({ type: 'error', text: res.error });
  };

  const deleteItem = async (id) => {
    const res = await apiFetch(`/users/content/${id}`, { method: 'DELETE' });
    if (res.success) { setItems(p => p.filter(i => i.id !== id)); setMsg({ type: 'success', text: res.message }); }
    else setMsg({ type: 'error', text: res.error });
  };

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Content Library</div>
        {hasPermission('content:write') && (
          <button className="btn btn-primary" onClick={() => setModal(true)}>+ New Content</button>
        )}
      </div>

      {msg && <Alert type={msg.type}>{msg.text}</Alert>}
      {!hasPermission('content:write') && <Alert type="info">You have read-only access. Editor+ can create content.</Alert>}

      {loading ? <Loading /> : (
        <div style={{ display: 'grid', gap: 16 }}>
          {items.map(item => (
            <div className="card" key={item.id}>
              <div className="card-body" style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, marginBottom: 4 }}>{item.title}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', fontFamily: 'Space Mono' }}>
                    {item.category} • {item.author || 'system'} •
                    <span style={{ color: item.status === 'published' || item.published ? 'var(--success)' : 'var(--text-muted)' }}>
                      {' '}{item.status || (item.published ? 'published' : 'draft')}
                    </span>
                    {item.readTime && ` • ${item.readTime}`}
                  </div>
                </div>
                {hasPermission('content:delete') && (
                  <button className="btn btn-danger btn-sm" onClick={() => deleteItem(item.id)}>Delete</button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {modal && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setModal(false)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">Create Content</div>
              <button className="modal-close" onClick={() => setModal(false)}>×</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Title</label>
                <input className="form-input" value={form.title} onChange={e => setForm(p => ({ ...p, title: e.target.value }))} />
              </div>
              <div className="form-group">
                <label className="form-label">Category</label>
                <select className="form-select" value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))}>
                  {['Security', 'Architecture', 'Tutorial', 'Announcement'].map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Body</label>
                <textarea className="form-input" rows="4" value={form.body} onChange={e => setForm(p => ({ ...p, body: e.target.value }))} />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={create}>Publish</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Profile Page ─────────────────────────────────────────────────────────────
const ProfilePage = () => {
  const { user } = useAuth();
  return (
    <div>
      <div className="section-title" style={{ marginBottom: 24 }}>My Profile</div>
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><span>👤</span><div className="card-title">Account Info</div></div>
          <div className="card-body">
            {[
              ['Username', user?.username],
              ['Email', user?.email],
              ['Role', <RoleBadge role={user?.role} />],
              ['Status', user?.isActive ? '✅ Active' : '❌ Inactive'],
              ['Last Login', user?.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'N/A'],
              ['Member Since', user?.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A']
            ].map(([k, v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: '1px solid var(--border)' }}>
                <span style={{ fontSize: 12, color: 'var(--text-muted)', fontFamily: 'Space Mono' }}>{k}</span>
                <span style={{ fontSize: 13 }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span>🔑</span><div className="card-title">Permissions</div></div>
          <div className="card-body">
            <div style={{ fontSize: 11, fontFamily: 'Space Mono', color: 'var(--text-muted)', marginBottom: 12 }}>
              {user?.permissions?.length} permissions granted via <strong style={{ color: ROLE_COLORS[user?.role] }}>{user?.role}</strong> role
            </div>
            <div className="perm-grid">
              {user?.permissions?.map(p => <PermTag key={p} perm={p} />)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── Reports Page ─────────────────────────────────────────────────────────────
const ReportsPage = () => {
  const { hasMinRole, hasPermission } = useAuth();
  const [reports, setReports] = useState([]);
  const [loading, setLoading] = useState(true);

  if (!hasMinRole('editor')) return <AccessDenied required="editor" />;

  useEffect(() => {
    apiFetch('/manager/reports').then(r => {
      if (r.success) setReports(r.data);
      setLoading(false);
    });
  }, []);

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Reports</div>
        {hasPermission('report:write') && (
          <button className="btn btn-primary">+ New Report</button>
        )}
      </div>
      {!hasPermission('report:write') && <Alert type="info">Read-only. Manager+ can create reports.</Alert>}
      {loading ? <Loading /> : (
        <div style={{ display: 'grid', gap: 12 }}>
          {reports.map(r => (
            <div className="card" key={r.id}>
              <div className="card-body" style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <div style={{ fontSize: 24 }}>📊</div>
                <div>
                  <div style={{ fontWeight: 700 }}>{r.title}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', fontFamily: 'Space Mono', marginTop: 4 }}>
                    {new Date(r.date).toLocaleDateString()} •
                    <span style={{ color: r.status === 'published' ? 'var(--success)' : 'var(--text-muted)', marginLeft: 4 }}>
                      {r.status}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// ─── Team Page ────────────────────────────────────────────────────────────────
const TeamPage = () => {
  const { hasMinRole } = useAuth();
  const [team, setTeam] = useState(null);
  const [loading, setLoading] = useState(true);

  if (!hasMinRole('manager')) return <AccessDenied required="manager" />;

  useEffect(() => {
    apiFetch('/manager/dashboard').then(r => {
      if (r.success) setTeam(r.data);
      setLoading(false);
    });
  }, []);

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Team Management</div>
        {team && <div style={{ fontSize: 12, fontFamily: 'Space Mono', color: 'var(--text-muted)' }}>{team.teamSize} members</div>}
      </div>
      {loading ? <Loading /> : team && (
        <div className="card">
          <table className="data-table">
            <thead><tr><th>Member</th><th>Role</th><th>Status</th><th>Last Login</th></tr></thead>
            <tbody>
              {team.teamMembers.map(m => (
                <tr key={m._id}>
                  <td>
                    <div style={{ fontWeight: 600 }}>{m.username}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{m.email}</div>
                  </td>
                  <td><RoleBadge role={m.role} /></td>
                  <td><span className={`status-dot ${m.isActive ? 'active' : 'inactive'}`} style={{ marginRight: 6 }}></span>{m.isActive ? 'Active' : 'Inactive'}</td>
                  <td style={{ fontSize: 12, color: 'var(--text-muted)' }}>{m.lastLogin ? new Date(m.lastLogin).toLocaleDateString() : 'Never'}</td>
                </tr>
              ))}
              {team.teamMembers.length === 0 && (
                <tr><td colSpan="4" style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 40 }}>No team members found</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

// ─── Audit Page ───────────────────────────────────────────────────────────────
const AuditPage = () => {
  const { hasPermission } = useAuth();
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  if (!hasPermission('audit:read')) return <AccessDenied required="admin" />;

  useEffect(() => {
    apiFetch('/admin/audit').then(r => { if (r.success) setData(r.data); setLoading(false); });
  }, []);

  return (
    <div>
      <div className="section-title" style={{ marginBottom: 24 }}>Audit & Role Configuration</div>
      {loading ? <Loading /> : (
        <div style={{ display: 'grid', gap: 16 }}>
          {data.map(({ role, level, permissionCount, permissions }) => (
            <div className="card" key={role} style={{ borderColor: `${ROLE_COLORS[role]}30` }}>
              <div className="card-header" style={{ background: `${ROLE_COLORS[role]}06` }}>
                <RoleBadge role={role} />
                <div style={{ marginLeft: 12, fontSize: 12, color: 'var(--text-muted)' }}>Level {level} — {permissionCount} permissions</div>
              </div>
              <div className="card-body">
                <div className="perm-grid">
                  {permissions.map(p => <PermTag key={p} perm={p} />)}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// ─── Settings Page ────────────────────────────────────────────────────────────
const SettingsPage = () => {
  const { hasPermission } = useAuth();
  const [settings, setSettings] = useState(null);
  const [loading, setLoading] = useState(true);

  if (!hasPermission('settings:read')) return <AccessDenied required="admin" />;

  useEffect(() => {
    apiFetch('/admin/settings').then(r => { if (r.success) setSettings(r.data); setLoading(false); });
  }, []);

  return (
    <div>
      <div className="section-title" style={{ marginBottom: 24 }}>System Settings</div>
      {loading ? <Loading /> : settings && (
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><span>⚙️</span><div className="card-title">Application Config</div></div>
            <div className="card-body">
              {[
                ['App Name', settings.appName],
                ['Version', settings.version],
                ['JWT Expiry', settings.jwtExpiry],
                ['Roles', settings.roles.join(', ')]
              ].map(([k, v]) => (
                <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid var(--border)' }}>
                  <span style={{ fontSize: 12, color: 'var(--text-muted)', fontFamily: 'Space Mono' }}>{k}</span>
                  <span style={{ fontSize: 13, fontFamily: 'Space Mono', color: 'var(--accent2)' }}>{v}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-header"><span>🔐</span><div className="card-title">Write Permission Required</div></div>
            <div className="card-body">
              <Alert type="warning">settings:write permission required to modify configuration. Current admin view is read-only preview.</Alert>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', lineHeight: 1.7 }}>
                In a production system, settings like JWT secrets, allowed origins, rate limits, and feature flags would be configurable here with proper change audit logging.
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Main App ──────────────────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard: 'Dashboard',
  profile: 'My Profile',
  content: 'Content',
  reports: 'Reports',
  team: 'Team',
  users: 'User Management',
  audit: 'Audit & Roles',
  settings: 'Settings',
  hierarchy: 'Role Hierarchy'
};

const AppShell = () => {
  const { user } = useAuth();
  const [page, setPage] = useState('dashboard');

  const PAGES = {
    dashboard: DashboardPage,
    profile: ProfilePage,
    content: ContentPage,
    reports: ReportsPage,
    team: TeamPage,
    users: UsersPage,
    audit: AuditPage,
    settings: SettingsPage,
    hierarchy: HierarchyPage
  };

  const PageComponent = PAGES[page] || DashboardPage;

  return (
    <div className="app-shell">
      <Sidebar activePage={page} setPage={setPage} />
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{PAGE_TITLES[page] || 'Dashboard'}</div>
          <span className={`topbar-badge role-${user?.role}`} style={{ color: ROLE_COLORS[user?.role], borderColor: `${ROLE_COLORS[user?.role]}50` }}>
            {user?.role}
          </span>
          <div style={{ fontSize: 11, fontFamily: 'Space Mono', color: 'var(--text-muted)' }}>
            EXP 3.1.3
          </div>
        </div>
        <div className="page-content">
          <PageComponent />
        </div>
      </div>
    </div>
  );
};

const App = () => {
  const { user, loading } = useAuth();

  if (loading) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <Loading />
    </div>
  );

  return user ? <AppShell /> : <LoginPage />;
};

const Root = () => (
  <AuthProvider>
    <App />
  </AuthProvider>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
